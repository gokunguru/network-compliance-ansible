! Sample config - PARTIALLY compliant (lab use only)
hostname SW1
!
service password-encryption
enable secret 9 $9$fakehashfakehash$fakehashfakehashfakehashfakehashfake
!
username admin privilege 15 secret 9 $9$fakehashfakehash$fakehashfakehashfakehashfakehashfake
!
ip domain-name lab.local
ip ssh version 2
!
interface Vlan1
 description MGMT
 ip address 192.168.100.21 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 switchport mode access
 switchport access vlan 10
!
interface GigabitEthernet0/2
 no shutdown
!
line con 0
 logging synchronous
line vty 0 4
 login local
 transport input ssh
!
end
 
