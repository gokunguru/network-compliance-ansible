---
# Compliance rules for Cisco IOS / IOS XE devices
# expect: present -> the pattern MUST be found in the config
# expect: absent  -> the pattern MUST NOT be found in the config
# severity: high | medium | low (defaults to medium)
compliance_checks:
  - id: CHECK-001
    title: Telnet must be disabled on VTY lines
    severity: high
    pattern: 'transport input (all|.*telnet)'
    expect: absent
  - id: CHECK-002
    title: SSH version 2 must be enabled
    severity: high
    pattern: '(?m)^ip ssh version 2$'
    expect: present
  - id: CHECK-003
    title: Password encryption service must be enabled
    severity: medium
    pattern: '(?m)^service password-encryption$'
    expect: present
  - id: CHECK-004
    title: Enable secret must be used instead of enable password
    severity: high
    pattern: '(?m)^enable password'
    expect: absent
