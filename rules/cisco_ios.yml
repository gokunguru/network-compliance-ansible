---
# Compliance rules for Cisco IOS / IOS XE devices
# expect: present -> the pattern MUST be found in the config
# expect: absent  -> the pattern MUST NOT be found in the config
# severity: high | medium | low (defaults to medium)
# type: regex (default) -> pattern/expect are matched against the raw config
# type: parsed          -> the config is parsed with cisco.ios resource modules and
#                          the named check in roles/compliance_audit/tasks/checks/ is run
# remediation: list of {parents, lines} blocks of IOS commands that fix a failed check
#              (parsed checks build their remediation dynamically)
# remediation_note: set instead of remediation when the fix needs a human decision
compliance_checks:
  - id: CHECK-001
    title: Telnet must be disabled on VTY lines
    severity: high
    pattern: 'transport input (all|.*telnet)'
    expect: absent
    remediation:
      - parents: ["line vty 0 4"]
        lines: ["transport input ssh"]
  - id: CHECK-002
    title: SSH version 2 must be enabled
    severity: high
    pattern: '(?m)^ip ssh version 2$'
    expect: present
    remediation:
      - lines: ["ip ssh version 2"]
  - id: CHECK-003
    title: Password encryption service must be enabled
    severity: medium
    pattern: '(?m)^service password-encryption$'
    expect: present
    remediation:
      - lines: ["service password-encryption"]
  - id: CHECK-004
    title: Enable secret must be used instead of enable password
    severity: high
    pattern: '(?m)^enable password'
    expect: absent
    remediation_note: >-
      Set a strong enable secret first (enable algorithm-type scrypt secret <secret>),
      then remove the legacy password (no enable password). Secrets are never generated by this tool.
  - id: CHECK-005
    title: Remote syslog server must be configured
    severity: medium
    pattern: '(?m)^logging host \S+'
    expect: present
    remediation:
      - lines: ["logging host {{ compliance_audit_remediation_syslog_host }}"]
  - id: CHECK-006
    title: Login banner must be configured
    severity: low
    pattern: '(?m)^banner (login|motd) '
    expect: present
    remediation:
      - lines: ["banner login ^C{{ compliance_audit_remediation_banner }}^C"]
  - id: CHECK-007
    title: VTY lines must have an idle timeout
    severity: medium
    pattern: '(?m)^line vty[^\n]*\n(?: [^\n]*\n)*? exec-timeout (?!0 0)'
    expect: present
    remediation:
      - parents: ["line vty 0 4"]
        lines: ["exec-timeout {{ compliance_audit_remediation_vty_timeout }} 0"]
  - id: CHECK-008
    title: VTY access must be restricted with an access-class
    severity: high
    pattern: '(?m)^line vty[^\n]*\n(?: [^\n]*\n)*? access-class \S+ in'
    expect: present
    remediation:
      - parents: ["ip access-list standard {{ compliance_audit_remediation_mgmt_acl }}"]
        lines: ["permit {{ compliance_audit_remediation_mgmt_network }}"]
      - parents: ["line vty 0 4"]
        lines: ["access-class {{ compliance_audit_remediation_mgmt_acl }} in"]
  - id: CHECK-009
    title: Unused interfaces must be administratively shut down
    severity: medium
    type: parsed
    check: unused_interfaces_shutdown
