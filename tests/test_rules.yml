---
- name: Test compliance rules against known-good and known-bad snippets
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/compliance_audit/defaults/main.yml
    - ../rules/cisco_ios.yml
    - rule_cases.yml
  vars:
    regex_rule_ids: "{{ compliance_checks | rejectattr('type', 'defined') | map(attribute='id') | list
      + compliance_checks | selectattr('type', 'defined') | selectattr('type', 'equalto', 'regex') | map(attribute='id') | list }}"

  tasks:
    - name: Every rule must have at least one PASS and one FAIL case
      ansible.builtin.assert:
        that:
          - rule_test_cases | selectattr('rule', 'equalto', item.id) | selectattr('expect', 'equalto', 'PASS') | list | length > 0
          - rule_test_cases | selectattr('rule', 'equalto', item.id) | selectattr('expect', 'equalto', 'FAIL') | list | length > 0
        fail_msg: "{{ item.id }} is missing a PASS or FAIL test case"
        quiet: true
      loop: "{{ compliance_checks }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Every rule must define a remediation (or a manual note)
      ansible.builtin.assert:
        that: >-
          item.remediation is defined
          or item.remediation_note is defined
          or (item.type | default('regex')) == 'parsed'
        fail_msg: "{{ item.id }} has no remediation and no remediation_note"
        quiet: true
      loop: "{{ compliance_checks }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Evaluate regex test cases
      ansible.builtin.set_fact:
        rule_test_failures: "{{ rule_test_failures | default([]) + ([test_error] if test_status != item.expect else []) }}"
      vars:
        test_error: "{{ item.rule }} ({{ item.desc }}): expected {{ item.expect }}, got {{ test_status }}"
        test_rule: "{{ compliance_checks | selectattr('id', 'equalto', item.rule) | first }}"
        test_status: "{{ 'PASS' if (item.config is search(test_rule.pattern)) == (test_rule.expect == 'present') else 'FAIL' }}"
      loop: "{{ rule_test_cases | selectattr('rule', 'in', regex_rule_ids) | list }}"
      loop_control:
        label: "{{ item.rule }} - {{ item.desc }}"

    - name: Evaluate parsed test cases
      ansible.builtin.include_tasks: run_parsed_case.yml
      loop: "{{ rule_test_cases | rejectattr('rule', 'in', regex_rule_ids) | list }}"
      loop_control:
        loop_var: test_case
        label: "{{ test_case.rule }} - {{ test_case.desc }}"

    - name: All test cases must match their expected status
      ansible.builtin.assert:
        that: rule_test_failures | default([]) | length == 0
        fail_msg: "{{ rule_test_failures }}"
        success_msg: "{{ rule_test_cases | length }} test cases passed"
