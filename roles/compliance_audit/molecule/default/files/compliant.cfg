! Golden config: passes every rule in rules/cisco_ios.yml
hostname COMPLIANT
!
service password-encryption
enable secret 9 $9$fakehashfakehash$fakehashfakehashfakehashfakehashfake
!
username admin privilege 15 secret 9 $9$fakehashfakehash$fakehashfakehashfakehashfakehashfake
!
ip domain-name lab.local
ip ssh version 2
!
logging host 192.168.100.250
ntp server 192.168.100.250
!
banner login ^CAuthorized access only^C
!
ip access-list standard MGMT-ACCESS
 permit 192.168.100.0 0.0.0.255
!
interface GigabitEthernet0/0
 description MGMT
 ip address 192.168.100.31 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 switchport mode access
 switchport access vlan 10
!
interface GigabitEthernet0/2
 shutdown
!
line con 0
 logging synchronous
line vty 0 4
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 login local
 transport input ssh
!
end
