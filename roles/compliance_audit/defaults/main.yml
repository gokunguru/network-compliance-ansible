---
# List of compliance checks to evaluate (id, title, pattern, expect)
compliance_audit_checks: []
# Path to the device configuration file to audit
compliance_audit_config_file: ""
# Fail the host at the end if at least one check failed
compliance_audit_fail_on_noncompliance: true
# Weight of each severity level in the compliance score
compliance_audit_severity_weights:
  high: 3
  medium: 2
  low: 1
# Generate a consolidated HTML report for all audited devices
compliance_audit_report_enabled: true
compliance_audit_report_path: "{{ playbook_dir }}/../reports/compliance-report.html"
# Generate a machine-readable JSON report (for SIEM, GRC tooling or CI gating)
compliance_audit_json_report_enabled: true
compliance_audit_json_report_path: "{{ playbook_dir }}/../reports/compliance-report.json"
