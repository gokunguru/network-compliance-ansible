---
# An interface is considered unused when it has no description, no switchport
# configuration and no IP address. Unused interfaces must be shut down.
# Logic lives in filter_plugins/compliance.py (unit-tested in tests/unit/).
- name: Find unused interfaces left enabled | {{ compliance_audit_check.id }}
  ansible.builtin.set_fact:
    compliance_audit_check_result:
      status: "{{ 'PASS' if offending | length == 0 else 'FAIL' }}"
      details: "{{ offending }}"
      remediation: "{{ offending | interface_remediation }}"
  vars:
    offending: "{{ compliance_audit_parsed.interfaces
      | unused_interfaces(compliance_audit_parsed.l2_interfaces, compliance_audit_parsed.l3_interfaces) }}"
