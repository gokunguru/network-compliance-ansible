---
- name: Load device config
  ansible.builtin.set_fact:
    compliance_audit_config: "{{ lookup('ansible.builtin.file', compliance_audit_config_file) }}"

- name: Parse configuration for structured checks
  ansible.builtin.include_tasks: parse.yml
  when: compliance_audit_checks | selectattr('type', 'defined') | selectattr('type', 'equalto', 'parsed') | list | length > 0

- name: Evaluate regex checks
  ansible.builtin.set_fact:
    compliance_audit_results: "{{ compliance_audit_results | default([]) + [compliance_audit_result] }}"
  vars:
    compliance_audit_result:
      id: "{{ item.id }}"
      title: "{{ item.title }}"
      severity: "{{ item.severity | default('medium') }}"
      weight: "{{ compliance_audit_severity_weights[item.severity | default('medium')] }}"
      status: "{{ 'PASS' if (compliance_audit_config is search(item.pattern)) == (item.expect == 'present') else 'FAIL' }}"
  loop: "{{ compliance_audit_checks | rejectattr('type', 'defined') | list
    + compliance_audit_checks | selectattr('type', 'defined') | selectattr('type', 'equalto', 'regex') | list }}"
  loop_control:
    label: "{{ item.id }}"

- name: Evaluate parsed checks
  ansible.builtin.include_tasks: evaluate_parsed.yml
  loop: "{{ compliance_audit_checks | selectattr('type', 'defined') | selectattr('type', 'equalto', 'parsed') | list }}"
  loop_control:
    loop_var: compliance_audit_check
    label: "{{ compliance_audit_check.id }}"

- name: Sort results by check ID
  ansible.builtin.set_fact:
    compliance_audit_results: "{{ compliance_audit_results | default([]) | sort(attribute='id') }}"

- name: Compute weighted compliance score
  ansible.builtin.set_fact:
    compliance_audit_score: "{{ ((passed_weight | int) * 100 / (total_weight | int)) | round | int if (total_weight | int) > 0 else 100 }}"
  vars:
    total_weight: "{{ compliance_audit_results | map(attribute='weight') | map('int') | sum }}"
    passed_weight: "{{ compliance_audit_results | selectattr('status', 'equalto', 'PASS') | map(attribute='weight') | map('int') | sum }}"

- name: Show audit summary
  ansible.builtin.debug:
    msg: "{{ item.status }} | {{ item.severity | upper }} | {{ item.id }} | {{ item.title }}"
  loop: "{{ compliance_audit_results }}"
  loop_control:
    label: "{{ item.id }}"

- name: Show weighted compliance score
  ansible.builtin.debug:
    msg: "Weighted compliance score: {{ compliance_audit_score }}%"

- name: Generate HTML compliance report
  ansible.builtin.template:
    src: report.html.j2
    dest: "{{ compliance_audit_report_path }}"
    mode: "0644"
  delegate_to: localhost
  run_once: true
  when: compliance_audit_report_enabled | bool

- name: Generate JSON compliance report
  ansible.builtin.template:
    src: report.json.j2
    dest: "{{ compliance_audit_json_report_path }}"
    mode: "0644"
  delegate_to: localhost
  run_once: true
  when: compliance_audit_json_report_enabled | bool

- name: Fail if any check failed
  ansible.builtin.assert:
    that: compliance_audit_results | selectattr('status', 'equalto', 'FAIL') | list | length == 0
    fail_msg: "{{ compliance_audit_results | selectattr('status', 'equalto', 'FAIL') | list | length }} check(s) failed"
    success_msg: "All checks passed"
  when: compliance_audit_fail_on_noncompliance | bool
