- name: Network compliance audit
  hosts: all
  gather_facts: false
  tasks:
    - name: Load device config
      ansible.builtin.set_fact:
        device_config: "{{ lookup('ansible.builtin.file', config_file) }}"

    - name: "CHECK-001 | Telnet must be disabled on VTY lines"
      ansible.builtin.assert:
        that: device_config is not search('transport input (all|.*telnet)')
        fail_msg: "FAIL - Telnet is allowed on VTY lines"
        success_msg: "PASS - Only SSH is allowed on VTY lines"