! Bootstrap for SW1 (Cisco IOL L2 switch). Paste in the console after "enable" / "conf t".
! Gives Ansible SSH access, and reproduces the findings of samples/configs/SW1.cfg.
hostname SW1
ip domain-name lab.local
username admin privilege 15 secret cisco
enable secret cisco
service password-encryption
ip ssh version 2
logging host 192.168.100.250
banner login #Authorized access only#
!
interface Vlan1
 description MGMT
 ip address 192.168.100.21 255.255.255.0
 no shutdown
!
interface Ethernet0/0
 description MGMT-UPLINK
 switchport mode access
!
interface Ethernet0/1
 switchport mode access
 switchport access vlan 10
!
interface Ethernet0/2
 no shutdown
!
line vty 0 4
 login local
 exec-timeout 10 0
 transport input ssh
!
crypto key generate rsa modulus 2048
end
write memory
