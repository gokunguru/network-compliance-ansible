! Bootstrap for R1 (Cisco IOL router). Paste in the console after "enable" / "conf t".
! Gives Ansible SSH access, and reproduces the findings of samples/configs/R1.cfg.
hostname R1
ip domain-name lab.local
ip http server
username admin privilege 15 password cisco
enable password cisco
no service password-encryption
!
interface Ethernet0/0
 description MGMT
 ip address 192.168.100.11 255.255.255.0
 no shutdown
!
interface Ethernet0/1
 no ip address
 no shutdown
!
line vty 0 4
 login local
 transport input telnet ssh
!
crypto key generate rsa modulus 2048
end
write memory
